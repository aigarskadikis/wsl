services:
  z64pg:
    image: zabbix/zabbix-server-pgsql:6.4.21-alpine
    container_name: z64pg
    environment:
      DB_SERVER_HOST: '10.88.74.16'
      DB_SERVER_PORT: '5432'
      POSTGRES_DB: 'z64'
      POSTGRES_PASSWORD: 'zabbix'
      POSTGRES_USER: 'zabbix'
      TZ: 'Europe/Riga'
      ZBX_ALLOWUNSUPPORTED16ERSIONS: '1'
      ZBX_CACHESIZE: '256M'
      ZBX_STARTAGENTPOLLERS: '0'
      ZBX_STARTALERTERS: '1'
      ZBX_STARTBROWSERPOLLERS: '0'
      ZBX_STARTDBSYNCERS: '1'
      ZBX_STARTDISCOVERERS: '1'
      ZBX_STARTODBCPOLLERS: '0'
      ZBX_STARTIPMIPOLLERS: '0'
      ZBX_STARTHISTORYPOLLERS: '1'
      ZBX_STARTHTTPAGENTPOLLERS: '0'
      ZBX_STARTHTTPPOLLERS: '0'
      ZBX_STARTLLDPROCESSORS: '1'

      ZBX_STARTPOLLERS: '0'
      ZBX_STARTJAVAPOLLERS: '0'
      ZBX_STARTPOLLERSUNREACHABLE: '0'

      ZBX_STARTPREPROCESSORS: '1'
      ZBX_STARTPRO64POLLERS: '1'
      ZBX_STARTSNMPPOLLERS: '0'
      ZBX_STARTTRAPPERS: '2'
      ZBX_STATSALLOWEDIP: second.ext

      ZBX_STARTPINGERS: '0'

    ports:
      - "16451:10051"
    networks:
      podnet:
        ipv4_address: 10.88.2.164
    tty: true
    restart: unless-stopped

  z64prx:
    image: zabbix/zabbix-proxy-sqlite3:6.4.21-alpine
    container_name: z64prx
    environment:
      ZBX_HOSTNAME: 'passive'
      ZBX_PRO64MODE: '1'
      TZ: 'Europe/Riga'
      ZBX_CACHESIZE: '256M'
      ZBX_SERVER_HOST: '10.88.2.164'
      ZBX_STARTAGENTPOLLERS: '0'
      ZBX_STARTBROWSERPOLLERS: '0'
      ZBX_STARTDBSYNCERS: '1'
      ZBX_STARTDISCOVERERS: '0'
      ZBX_STARTODBCPOLLERS: '0'
      ZBX_STARTIPMIPOLLERS: '0'
      ZBX_STARTHISTORYPOLLERS: '0'
      ZBX_STARTHTTPAGENTPOLLERS: '0'
      ZBX_STARTHTTPPOLLERS: '0'
      ZBX_STARTPINGERS: '0'
      ZBX_STARTPOLLERS: '0'
      ZBX_STARTJAVAPOLLERS: '0'
      ZBX_STARTPOLLERSUNREACHABLE: '0'
      ZBX_STARTPREPROCESSORS: '1'
      ZBX_STARTSNMPPOLLERS: '0'
      ZBX_STARTTRAPPERS: '2'
      ZBX_STATSALLOWEDIP: second.ext

    ports:
      - "26451:10051"
    networks:
      podnet:
        ipv4_address: 10.88.3.164
    tty: true
    restart: unless-stopped


  z64web:
    image: zabbix/zabbix-web-nginx-pgsql:6.4.21-alpine
    container_name: z64web
    environment:
      DB_SERVER_HOST: '10.88.74.16'
      DB_SERVER_PORT: '5432'
      POSTGRES_DB: 'z64'
      POSTGRES_USER: 'zabbix'
      POSTGRES_PASSWORD: 'zabbix'
      ZBX_SERVER_HOST: '10.88.2.164'
      ZBX_SERVER_PORT: '10051'
      PHP_TZ: 'Europe/Riga'

    ports:
      - "8064:8080"
    networks:
      podnet:
        ipv4_address: 10.88.1.164
    tty: true
    restart: unless-stopped

networks:
  podnet:
    name: DockerInternalNet
    external: true

