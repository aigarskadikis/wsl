services:
  my80:
    image: mysql:8.0.44-oraclelinux9
    container_name: my80
    environment:
      MYSQL_ROOT_PASSWORD: 'zabbix'

    volumes:
      - '${HOME}/mysql/80/datadir:/var/lib/mysql'
      - '${HOME}/mysql/80/conf.d:/etc/mysql/conf.d'

    ports:
      - '3380:3306'
    networks:
      podnet:
        ipv4_address: '10.88.8.0'
    tty: true
    restart: unless-stopped

networks:
  podnet:
    name: DockerInternalNet
    external: true

